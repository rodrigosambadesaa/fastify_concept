name: One-time npm lockfile refresh

on:
  push:
    branches: [feat/postgres-secure-api-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'rodrigosambadesaa/fastify_concept'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve lockfile without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the lockfile
        if: github.ref == 'refs/heads/feat/postgres-secure-api-ci'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock dev-only Swagger dependencies"
            git push origin HEAD:feat/postgres-secure-api-ci
          fi
