name: Bootstrap synchronized npm lockfile

on:
  push:
    branches: [feat/postgres-secure-api-ci]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'rodrigosambadesaa/fastify_concept'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve exact dependencies without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only refreshed lockfile on dedicated work branch
        if: github.ref == 'refs/heads/feat/postgres-secure-api-ci'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:feat/postgres-secure-api-ci
          fi
