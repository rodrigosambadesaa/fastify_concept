name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-integration:
    name: TypeScript, PostgreSQL integration and dependency audit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: fastify_concept_test
          POSTGRES_USER: fastify_test
          POSTGRES_PASSWORD: ci_password_only
        options: >-
          --health-cmd "pg_isready -U fastify_test -d fastify_concept_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fastify_test:ci_password_only@127.0.0.1:5432/fastify_concept_test
      API_KEY: ci-only-secret-key-12345678901234567890
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Verify lockfile is synchronized
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Build distributable JavaScript
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run real PostgreSQL integration tests
        run: npm test
      - name: Audit production dependencies at all severity levels
        run: npm audit --omit=dev --audit-level=low

  container-build:
    name: Build production container
    runs-on: ubuntu-24.04
    needs: quality-and-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image without runtime credentials
        run: docker build --pull --tag fastify-concept:ci .
      - name: Verify production runtime imports without dev-only Swagger
        run: docker run --rm --entrypoint node fastify-concept:ci --input-type=module -e "await import('./dist/src/app.js'); console.log('Production runtime imports OK')"

  compose-smoke:
    name: Compose end-to-end persistence and security smoke test
    runs-on: ubuntu-24.04
    needs: container-build
    env:
      POSTGRES_USER: fastify
      POSTGRES_PASSWORD: ci-only-url-safe-db-password-123456789
      API_KEY: ci-only-secret-key-12345678901234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start persistent PostgreSQL + API
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Exercise real HTTP and verify data survives API restart
        run: node tests/compose-smoke.mjs
      - name: Collect container status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=80
      - name: Tear down integration environment without changing real databases
        if: always()
        run: docker compose down --volumes --remove-orphans
